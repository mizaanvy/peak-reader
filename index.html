<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Peak – PDF and image reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<style>
:root{color-scheme:dark;--bg:#000;--panel:#0d0d0d;--line:#262626;--ink:#f5f5f5;--mute:#8c8c8c;--hi:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:500 14px/1.4 'Chakra Petch',system-ui,-apple-system,'Segoe UI',sans-serif;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:1px solid var(--line);border-radius:3px;padding:7px 12px;cursor:pointer;min-height:34px}
button:hover:not(:disabled){border-color:#666}button:disabled{opacity:.3;cursor:default}
button:focus-visible,input:focus-visible,.tab:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
button.solid{background:var(--hi);color:#000;border-color:var(--hi);font-weight:600}
button.on{background:#222;border-color:#777}
header{display:flex;align-items:center;gap:16px;padding:10px 16px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;flex:none}.brand img.m{height:26px}.brand img.w{height:15px}
.tabs{flex:1;display:flex;gap:6px;overflow-x:auto;min-width:0;scrollbar-width:none}
.tab{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:3px;padding:5px 6px 5px 12px;white-space:nowrap;max-width:220px;cursor:pointer;color:var(--mute)}
.tab.on{color:var(--ink);border-color:#777;background:#161616}.tab span{overflow:hidden;text-overflow:ellipsis}
.tab b{font-weight:400;padding:0 6px;border-radius:2px}.tab b:hover{background:#333}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.bar[hidden]{display:none}.grp{display:flex;align-items:center;gap:6px}.sp{flex:1}
.bar input{width:54px;text-align:center;background:#000;color:var(--ink);border:1px solid var(--line);border-radius:3px;padding:6px;font:inherit}
.lbl{color:var(--mute);min-width:44px;text-align:center}
.bar select{background:#000;color:var(--ink);border:1px solid var(--line);border-radius:3px;padding:7px 8px;font:inherit;min-height:34px;max-width:min(320px,62vw)}
.bar input[type=range]{width:96px;padding:0;border:0;accent-color:#fff;background:none}
main{flex:1;min-height:0;position:relative}
#stage{position:absolute;inset:0;overflow:auto;padding:20px 28px 40px;background:#060606;cursor:grab;-webkit-overflow-scrolling:touch}
#stage.drag{cursor:grabbing;user-select:none}
#stage canvas{display:block;margin:0 auto;background:#fff;box-shadow:0 0 0 1px #222,0 12px 48px rgba(0,0,0,.8)}
#stage.night canvas{filter:invert(1) hue-rotate(180deg)}
#empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px}
#empty img{width:min(300px,62vw);filter:drop-shadow(0 0 28px rgba(255,255,255,.28))}
#empty h1{margin:6px 0 0;font-size:clamp(22px,4vw,30px);font-weight:600;letter-spacing:.01em}
#empty p{margin:0;color:var(--mute);max-width:42ch}
#dropveil{position:absolute;inset:10px;border:2px dashed #fff;border-radius:6px;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;font-size:20px;z-index:5}
body.over #dropveil{display:flex}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#fff;color:#000;padding:10px 16px;border-radius:3px;display:none;z-index:20;max-width:90vw}
#loader{position:fixed;inset:0;z-index:50;background:#000;display:flex;align-items:center;justify-content:center;transition:opacity .6s}
#loader.out{opacity:0;pointer-events:none}
#loader video{width:100%;height:100%;object-fit:contain;background:#000}
#loader .still{display:none;flex-direction:column;align-items:center;gap:22px;position:absolute}
#loader.fallback video{display:none}#loader.fallback .still{display:flex}
#loader .still img.m{width:min(300px,60vw)}#loader .still img.w{width:min(300px,60vw)}
#skip{position:absolute;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));background:rgba(0,0,0,.6)}
@media (max-width:640px){header{padding:8px 12px}.brand img.w{display:none}.bar{padding:6px 10px}#stage{padding:12px 10px 30px}.hide-s{display:none}}
@media (prefers-reduced-motion:reduce){#loader{transition:none}}
</style>
</head>

    <h1>Open a PDF or image</h1>
    <p>Drop files anywhere in this window, or choose them from your device. Everything stays on your device.</p>
    <button class="solid" id="openBtn2" type="button">Choose files</button>

<div id="toast" role="alert"></div>

<script>
(function(){
var $=function(s){return document.querySelector(s)};
var lib=window['pdfjs-dist/build/pdf'];
if(lib)lib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
var docs=[],cur=-1,token=0,night=false,stage=$('#stage');

/* loading screen */
var loader=$('#loader'),lv=$('#lv'),gone=false;
function endLoader(){if(gone)return;gone=true;loader.classList.add('out');try{lv.pause()}catch(e){}setTimeout(function(){loader.remove()},700)}
$('#skip').onclick=endLoader;lv.onended=endLoader;
lv.onerror=function(){loader.classList.add('fallback');setTimeout(endLoader,2200)};
var p=lv.play();if(p&&p.catch)p.catch(function(){loader.classList.add('fallback');$('#skip').textContent='Enter';setTimeout(endLoader,3000)});

/* toast */
var tt;function toast(m){var t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(function(){t.style.display='none'},4200)}

/* opening files */
function pick(){$('#file').click()}
$('#openBtn').onclick=pick;$('#openBtn2').onclick=pick;
$('#file').onchange=function(e){addFiles(e.target.files);e.target.value=''};
async function addFiles(list){
  var n=0;
  for(var f of Array.from(list)){
    var nm=f.name||'Untitled',isPdf=f.type==='application/pdf'||/\.pdf$/i.test(nm),isImg=/^image\//.test(f.type)||/\.(png|jpe?g|gif|webp|bmp|avif|svg)$/i.test(nm);
    try{
      if(isPdf){
        if(!lib)throw new Error('The PDF engine did not load. Check your connection and reload.');
        var pdf=await lib.getDocument({data:await f.arrayBuffer()}).promise;
        docs.push({kind:'pdf',name:nm,pdf:pdf,page:1,zoom:1,rot:0});n++;
      }else if(isImg){
        var img=await loadImg(URL.createObjectURL(f));
        docs.push({kind:'img',name:nm,img:img,zoom:1,rot:0});n++;
      }else toast('“'+nm+'” isn’t a PDF or image.');
    }catch(err){toast('Couldn’t open “'+nm+'”. '+(err&&err.name==='PasswordException'?'It’s password protected.':'The file may be damaged.'))}
  }
  if(n){cur=docs.length-1;sync()}
}
function loadImg(u){return new Promise(function(res,rej){var i=new Image();i.onload=function(){res(i)};i.onerror=rej;i.src=u})}

/* tabs and chrome */
function sync(){
  var tabs=$('#tabs');tabs.innerHTML='';
  docs.forEach(function(d,i){
    var t=document.createElement('div');t.className='tab'+(i===cur?' on':'');t.tabIndex=0;t.setAttribute('role','tab');t.title=d.name;
    var s=document.createElement('span');s.textContent=d.name;var x=document.createElement('b');x.textContent='×';x.setAttribute('aria-label','Close '+d.name);
    x.onclick=function(e){e.stopPropagation();close(i)};
    t.onclick=function(){cur=i;sync()};t.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();cur=i;sync()}};
    t.append(s,x);tabs.append(t);
  });
  var has=cur>=0;$('#empty').style.display=has?'none':'flex';stage.hidden=!has;$('#bar').hidden=!has;stopSpeech();$('#vbar').hidden=!(has&&docs[cur].kind==='pdf'&&synth);
  if(has){$('#pager').style.display=docs[cur].kind==='pdf'?'flex':'none';var on=tabs.children[cur];if(on&&on.scrollIntoView)on.scrollIntoView({block:'nearest',inline:'nearest'});render()}
}
function close(i){docs.splice(i,1);if(cur>=docs.length)cur=docs.length-1;sync()}

/* rendering */
async function render(){
  var d=docs[cur];if(!d)return;var my=++token;
  var sw=Math.max(200,stage.clientWidth-(window.innerWidth<=640?20:56)),c=document.createElement('canvas'),ctx=c.getContext('2d'),dpr=window.devicePixelRatio||1;
  try{
    if(d.kind==='pdf'){
      var page=await d.pdf.getPage(d.page);if(my!==token)return;
      var rot=((page.rotate||0)+d.rot)%360,v1=page.getViewport({scale:1,rotation:rot}),s=sw/v1.width*d.zoom,W=v1.width*s,H=v1.height*s,r=Math.min(dpr,8000/Math.max(W,H));
      c.width=Math.floor(W*r);c.height=Math.floor(H*r);c.style.width=W+'px';c.style.height=H+'px';
      var vp=page.getViewport({scale:s*r,rotation:rot});
      if(d.task){try{d.task.cancel()}catch(e){}}
      d.task=page.render({canvasContext:ctx,viewport:vp});await d.task.promise;
      $('#pg').value=d.page;$('#pg').max=d.pdf.numPages;$('#pgTotal').textContent='of '+d.pdf.numPages;
      $('#prev').disabled=d.page<=1;$('#next').disabled=d.page>=d.pdf.numPages;
    }else{
      var sideways=d.rot%180!==0,nw=sideways?d.img.naturalHeight:d.img.naturalWidth,nh=sideways?d.img.naturalWidth:d.img.naturalHeight,s2=sw/nw*d.zoom,W2=nw*s2,H2=nh*s2,r2=Math.min(dpr,8000/Math.max(W2,H2));
      c.width=Math.floor(W2*r2);c.height=Math.floor(H2*r2);c.style.width=W2+'px';c.style.height=H2+'px';
      ctx.setTransform(r2,0,0,r2,0,0);ctx.translate(W2/2,H2/2);ctx.rotate(d.rot*Math.PI/180);
      var iw=d.img.naturalWidth*s2,ih=d.img.naturalHeight*s2;ctx.drawImage(d.img,-iw/2,-ih/2,iw,ih);
    }
    if(my!==token)return;
    stage.replaceChildren(c);$('#zl').textContent=Math.round(d.zoom*100)+'%';
  }catch(e){if(e&&e.name==='RenderingCancelledException')return;toast('This page couldn’t be drawn.')}
}
function go(n){var d=docs[cur];if(!d||d.kind!=='pdf')return;n=Math.max(1,Math.min(d.pdf.numPages,n|0||1));if(n!==d.page){d.page=n;stage.scrollTop=0;render();if(reading)speakPage()}else $('#pg').value=n}
function zoom(f){var d=docs[cur];if(!d)return;d.zoom=Math.max(.25,Math.min(6,+(d.zoom*f).toFixed(3)));render()}
$('#prev').onclick=function(){go(docs[cur].page-1)};$('#next').onclick=function(){go(docs[cur].page+1)};
$('#pg').onchange=function(e){go(+e.target.value)};
$('#zi').onclick=function(){zoom(1.25)};$('#zo').onclick=function(){zoom(.8)};
$('#fit').onclick=function(){docs[cur].zoom=1;render()};
$('#rot').onclick=function(){var d=docs[cur];d.rot=(d.rot+90)%360;render()};
$('#night').onclick=function(){night=!night;stage.classList.toggle('night',night);this.classList.toggle('on',night);this.setAttribute('aria-pressed',night)};
$('#full').onclick=function(){if(document.fullscreenElement)document.exitFullscreen();else if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen()};

/* read aloud */
var reading=false,spToken=0,synth=window.speechSynthesis,vsel=$('#voice');
function loadVoices(){
  var vs=synth.getVoices();if(!vs.length)return;var keep=vsel.value,lg=navigator.language||'en';
  vs=vs.slice().sort(function(a,b){return a.lang.localeCompare(b.lang)||a.name.localeCompare(b.name)});
  vsel.innerHTML='';vs.forEach(function(v){var o=document.createElement('option');o.value=v.voiceURI;o.textContent=v.name+' – '+v.lang;vsel.append(o)});
  var pick=vs.find(function(v){return v.voiceURI===keep})||vs.find(function(v){return v.lang===lg})||vs.find(function(v){return v.lang.slice(0,2)===lg.slice(0,2)})||vs[0];
  vsel.value=pick.voiceURI;
}
if(synth){loadVoices();synth.onvoiceschanged=loadVoices;window.addEventListener('pagehide',function(){synth.cancel()})}
function setUI(){var b=$('#spPlay');b.textContent=reading?'Stop':'Listen';b.classList.toggle('solid',!reading);b.classList.toggle('on',reading);$('#spPause').disabled=!reading;$('#spPause').textContent='Pause'}
function stopSpeech(){reading=false;spToken++;if(synth)synth.cancel();setUI()}
function chunks(t){var out=[],c='';(t.match(/[^.!?。؟]+[.!?。؟]*\s*/g)||[t]).forEach(function(s){if(c&&(c+s).length>220){out.push(c);c=s}else c+=s});if(c)out.push(c);return out}
async function speakPage(){
  var d=docs[cur];if(!d||d.kind!=='pdf'||!reading)return;
  synth.cancel();var my=++spToken,n=d.page;
  function next(){if(d.page<d.pdf.numPages)go(d.page+1);else stopSpeech()}
  var tc=await (await d.pdf.getPage(n)).getTextContent();if(my!==spToken)return;
  var text=tc.items.map(function(i){return i.str+(i.hasEOL?' ':'')}).join('').replace(/\s+/g,' ').trim();
  if(!text){toast('Page '+n+' has no readable text. It may be a scanned image.');next();return}
  var v=synth.getVoices().find(function(x){return x.voiceURI===vsel.value}),parts=chunks(text);
  parts.forEach(function(p,i){
    var u=new SpeechSynthesisUtterance(p);if(v){u.voice=v;u.lang=v.lang}
    u.rate=+$('#rate').value;u.pitch=+$('#pitch').value;
    if(i===parts.length-1)u.onend=function(){if(my===spToken&&reading)next()};
    synth.speak(u);
  });
}
$('#spPlay').onclick=function(){if(reading)stopSpeech();else{reading=true;setUI();speakPage()}};
$('#spPause').onclick=function(){if(synth.paused){synth.resume();this.textContent='Pause'}else{synth.pause();this.textContent='Resume'}};
$('#voice').onchange=function(){if(reading)speakPage()};
$('#rate').oninput=function(){$('#rateV').textContent=(+this.value).toFixed(1)+'×'};
$('#pitch').oninput=function(){$('#pitchV').textContent=(+this.value).toFixed(1)};
$('#rate').onchange=$('#pitch').onchange=function(){if(reading)speakPage()};

/* keyboard, wheel, drag-to-pan */
document.addEventListener('keydown',function(e){
  if(cur<0||/INPUT/.test(e.target.tagName))return;var d=docs[cur];
  if(e.key==='ArrowRight'||e.key==='PageDown'){go(d.page+1)}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){go(d.page-1)}
  else if(e.key==='+'||e.key==='='){zoom(1.25)}else if(e.key==='-'){zoom(.8)}else if(e.key==='0'){d.zoom=1;render()}else if(e.key==='r'){$('#rot').click()}
});
stage.addEventListener('wheel',function(e){if(e.ctrlKey||e.metaKey){e.preventDefault();zoom(e.deltaY<0?1.1:.9)}},{passive:false});
var pan=null;
stage.addEventListener('pointerdown',function(e){if(e.pointerType!=='mouse'||e.button!==0)return;pan={x:e.clientX,y:e.clientY,l:stage.scrollLeft,t:stage.scrollTop};stage.classList.add('drag');stage.setPointerCapture(e.pointerId)});
stage.addEventListener('pointermove',function(e){if(!pan)return;stage.scrollLeft=pan.l-(e.clientX-pan.x);stage.scrollTop=pan.t-(e.clientY-pan.y)});
function endPan(){pan=null;stage.classList.remove('drag')}
stage.addEventListener('pointerup',endPan);stage.addEventListener('pointercancel',endPan);
var rz;window.addEventListener('resize',function(){clearTimeout(rz);rz=setTimeout(render,150)});

/* drag and drop */
var depth=0;
window.addEventListener('dragenter',function(e){e.preventDefault();depth++;document.body.classList.add('over')});
window.addEventListener('dragover',function(e){e.preventDefault()});
window.addEventListener('dragleave',function(){if(--depth<=0){depth=0;document.body.classList.remove('over')}});
window.addEventListener('drop',function(e){e.preventDefault();depth=0;document.body.classList.remove('over');if(e.dataTransfer&&e.dataTransfer.files.length)addFiles(e.dataTransfer.files)});
})();
</script>
</body>
